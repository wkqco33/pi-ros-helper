name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: npm run check
      - name: Verify package contents
        run: npm pack --dry-run --json > pack.json
      - name: Upload package manifest
        if: always() && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: npm-pack-manifest
          path: pack.json

  extension-smoke:
    name: pi extension smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pi CLI
        run: npm install --global @earendil-works/pi-coding-agent
      - name: Load extension
        run: pi -e ./extensions/index.ts --list-models
